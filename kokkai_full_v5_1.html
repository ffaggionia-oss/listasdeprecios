<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kokkai · Lista de Favoritos</title>
<style>
  :root {
    --gold: #C9A84C;
    --gold-light: #F0D88A;
    --black: #0A0A0A;
    --bg: #F7F5F0;
    --card: #FFFFFF;
    --border: #E0DAD0;
    --text: #1A1A1A;
    --text2: #666;
    --ml-color: #7B5EA7;
    --ml-bg: #F3EEF9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .header { background: var(--black); padding: 18px 24px; display: flex; align-items: center; gap: 16px; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-mark { width: 38px; height: 38px; background: var(--gold); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; color: var(--black); letter-spacing: -1px; }
  .logo-text { color: white; font-size: 20px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
  .logo-sub { color: var(--gold); font-size: 11px; letter-spacing: 3px; text-transform: uppercase; margin-top: 2px; }
  .header-right { margin-left: auto; color: var(--gold); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }

  .controls { padding: 16px 24px 0; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .search-wrap { position: relative; flex: 1; min-width: 200px; }
  .search-wrap input { width: 100%; padding: 10px 16px 10px 40px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; background: white; outline: none; transition: border-color .2s; }
  .search-wrap input:focus { border-color: var(--gold); }
  .search-wrap::before { content: '🔍'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; }
  .filter-btn { padding: 10px 16px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; background: white; cursor: pointer; transition: all .2s; white-space: nowrap; }
  .filter-btn:hover, .filter-btn.active { border-color: var(--gold); background: #FBF5E6; color: var(--black); font-weight: 600; }
  .filter-btn.all.active { background: var(--gold); border-color: var(--gold); color: var(--black); }

  .list-toggle { padding: 12px 24px 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .list-btn { padding: 7px 18px; border-radius: 20px; border: 1.5px solid var(--border); font-size: 12px; font-weight: 600; cursor: pointer; background: white; letter-spacing: .5px; transition: all .2s; }
  .list-btn.active-a { background: #1A1A1A; border-color: #1A1A1A; color: white; }
  .list-btn.active-b { background: #2D5A8E; border-color: #2D5A8E; color: white; }
  .list-btn.active-c { background: #7B5EA7; border-color: #7B5EA7; color: white; }
  .list-btn:not([class*="active"]):hover { border-color: var(--gold); }

  .stats { padding: 10px 24px; font-size: 12px; color: var(--text2); }
  .stats span { color: var(--gold); font-weight: 700; }

  .table-wrap { padding: 0 24px 40px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-top: 12px; min-width: 700px; }
  thead { background: var(--black); }
  thead th { color: var(--gold); font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 12px 14px; text-align: left; white-space: nowrap; }
  thead th.price { text-align: right; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .15s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #FDFBF6; }
  tbody td { padding: 11px 14px; font-size: 13px; vertical-align: middle; }

  .cat-label { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .8px; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; white-space: nowrap; }
  .cat-dec { background: #E8F4E8; color: #2D7A2D; }
  .cat-clh { background: #E8EEF4; color: #2D4E7A; }
  .cat-cls { background: #F4EDE8; color: #7A4E2D; }
  .cat-acc { background: #F0F0F0; color: #555; }

  .madera { font-weight: 600; font-size: 13px; }
  .perfil { color: var(--text2); font-size: 12px; margin-top: 2px; }
  .linea-tag { font-size: 11px; color: #aaa; margin-top: 2px; }

  td.price { text-align: right; font-weight: 600; font-size: 14px; white-space: nowrap; }
  .price-main { font-weight: 700; }
  .price-sub { font-size: 10px; color: #aaa; font-weight: 400; display: block; margin-top: 2px; }

  .unit-badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-left: 4px; vertical-align: middle; }
  .unit-m2 { background: #E8F4E8; color: #2D7A2D; }
  .unit-ml { background: var(--ml-bg); color: var(--ml-color); }
  .unit-un { background: #F0F0F0; color: #555; }

  .largos { font-size: 12px; color: var(--text2); white-space: nowrap; }
  .no-results { text-align: center; padding: 60px 20px; color: var(--text2); }
  .section-header td { font-size: 10px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #999; padding: 7px 14px !important; background: #F5F0E8; }

  .legend { padding: 8px 24px 0; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; font-size: 11px; color: var(--text2); }
  .legend-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-mark">KK</div>
    <div>
      <div class="logo-text">Kokkai</div>
      <div class="logo-sub">Wood Products</div>
    </div>
  </div>
  <div class="header-right">⭐ Lista de Favoritos</div>
</div>

<div class="controls">
  <div class="search-wrap">
    <input type="text" id="search" placeholder="Buscar por madera, perfil, medidas..." oninput="render()">
  </div>
  <button class="filter-btn all active" onclick="setFilter('all',this)">Todos</button>
  <button class="filter-btn" onclick="setFilter('Decking',this)">🪵 Decking</button>
  <button class="filter-btn" onclick="setFilter('Cladding Hardwood',this)">🌿 Cladding HW</button>
  <button class="filter-btn" onclick="setFilter('Cladding Softwood',this)">🌲 Cladding SW</button>
  <button class="filter-btn" onclick="setFilter('Accesorios',this)">🔧 Accesorios</button>
</div>

<div class="list-toggle">
  <button class="list-btn active-a" id="btn-a" onclick="toggleList('a')">Lista A — B2C USD</button>
  <button class="list-btn active-b" id="btn-b" onclick="toggleList('b')">Lista B — B2B Nac. USD</button>
  <button class="list-btn active-c" id="btn-c" onclick="toggleList('c')">Lista C — B2B CIF EUR</button>
</div>

<div class="legend">
  <span style="font-weight:600;color:#555;">Unidades:</span>
  <span><span class="legend-dot" style="background:#2D7A2D;"></span>m² — precio por metro cuadrado</span>
  <span><span class="legend-dot" style="background:var(--ml-color);"></span>m/l — precio por metro lineal</span>
  <span><span class="legend-dot" style="background:#888;"></span>UN — precio por unidad</span>
</div>

<div class="stats" id="stats"></div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th style="width:130px">Categoría</th>
        <th>Producto</th>
        <th>Medidas</th>
        <th>Largos (mm)</th>
        <th class="price col-a">Lista A</th>
        <th class="price col-b">Lista B</th>
        <th class="price col-c">Lista C</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

let activeFilter = 'all';
let activeLists = {a:true, b:true, c:true};

function catClass(c) {
  return {Decking:'cat-dec','Cladding Hardwood':'cat-clh','Cladding Softwood':'cat-cls',Accesorios:'cat-acc'}[c] || 'cat-acc';
}
function catIcon(c) {
  return {Decking:'🪵','Cladding Hardwood':'🌿','Cladding Softwood':'🌲',Accesorios:'🔧'}[c] || '';
}
function unitBadge(u) {
  if (u==='m²') return '<span class="unit-badge unit-m2">m²</span>';
  if (u==='m/l') return '<span class="unit-badge unit-ml">m/l</span>';
  return '<span class="unit-badge unit-un">UN</span>';
}

function fmtPrice(val, currency, decimals) {
  if (val===null || val===undefined) return '<span style="color:#ccc">—</span>';
  return (currency||'USD') + ' ' + val.toFixed(decimals||2);
}

function setFilter(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function toggleList(list) {
  activeLists[list] = !activeLists[list];
  const btn = document.getElementById('btn-'+list);
  btn.className = activeLists[list] ? 'list-btn active-'+list : 'list-btn';
  document.querySelectorAll('.col-'+list).forEach(el => el.style.display = activeLists[list] ? '' : 'none');
  render();
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = D.filter(item => {
    if (activeFilter !== 'all' && item.cat !== activeFilter) return false;
    if (q) {
      const hay = [item.madera, item.perfil, item.linea, item.medidas, item.largos].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  let html = '';
  let lastCat = null;

  filtered.forEach(item => {
    if (item.cat !== lastCat) {
      html += `<tr class="section-header"><td colspan="7">${catIcon(item.cat)}  ${item.cat}</td></tr>`;
      lastCat = item.cat;
    }

    const isML = item.u === 'm/l';
    const isUN = item.u === 'UN';
    const dec = (isML || isUN) ? 4 : 2;
    const cur_c = 'EUR';

    // Lista A
    const pa = fmtPrice(item.a, 'USD', dec);
    // Lista B
    let pb = fmtPrice(item.b, 'USD', dec);
    if (isML && item.b_m2) pb += `<span class="price-sub">= USD ${item.b_m2.toFixed(2)}/m²</span>`;
    // Lista C
    let pc = fmtPrice(item.c, cur_c, dec);
    if (isML && item.c_m2) pc += `<span class="price-sub">= EUR ${item.c_m2.toFixed(2)}/m²</span>`;

    html += `<tr>
      <td><span class="cat-label ${catClass(item.cat)}">${item.cat}</span></td>
      <td>
        <div class="madera">${item.madera}</div>
        <div class="perfil">${item.perfil}</div>
        <div class="linea-tag">${item.linea}</div>
      </td>
      <td>${item.medidas} ${unitBadge(item.u)}</td>
      <td class="largos">${item.largos}</td>
      <td class="price col-a" style="display:${activeLists.a?'':'none'}">${pa}</td>
      <td class="price col-b" style="display:${activeLists.b?'':'none'}">${pb}</td>
      <td class="price col-c" style="display:${activeLists.c?'':'none'}">${pc}</td>
    </tr>`;
  });

  if (!html) html = '<tr><td colspan="7" class="no-results">Sin resultados</td></tr>';
  document.getElementById('tbody').innerHTML = html;
  document.getElementById('stats').innerHTML = `Mostrando <span>${filtered.length}</span> de <span>${D.length}</span> artículos favoritos`;
}

render();
</script>
